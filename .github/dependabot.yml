version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    schedule:
      interval: weekly
    ignore:
      # Track the Node.js runtime major (24.x, see .node-version).
      # Bump deliberately when the runtime moves to a new major.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      jest:
        patterns:
          - "@jest/*"
          - "@swc/core"
          - "@swc/jest"
          - "jest"
          - "jest-junit"
      lerna-lite:
        patterns:
          - "@lerna-lite/*"
      lint:
        patterns:
          - "xo"
          - "eslint-config-xo-*"
